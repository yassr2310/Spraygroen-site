<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spraygroen.nl | Hydraulisch Zaaien & Gazonaanleg</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background: #f4f7f4; color: #333; overflow-x: hidden; }
        
        /* Video Header Container */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            overflow: hidden;
        }

        /* De Video Achtergrond */
        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Donkere laag over de video voor leesbaarheid tekst */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
        }

        /* Inhoud bovenop de video */
        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 800px;
            padding: 20px;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        /* Opvallende Actieknop */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        .btn:hover {
            background: #27ae60;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Vervang 'video.mp4' straks door de link naar jouw eigen video-bestand -->
        <video autoplay loop muted playsinline class="hero-video">
            <source src="video.mp4" type="video/mp4">
            Je browser ondersteunt geen video-achtergronden.
        </video>
        <div class="overlay"></div>
        
        <div class="hero-content">
            <h1>Binnen 3 weken een perfect, diepgroen gazon</h1>
            <p>Dé revolutie in gazonaanleg met hydroseeding. Snel, voordelig en ijzersterk.</p>
            <a href="#contact" class="btn">Gratis Offerte Aanvragen</a>
        </div>
    </section>

</body>
</html>
